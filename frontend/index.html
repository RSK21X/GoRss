<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; frame-src about:; connect-src 'none'; object-src 'none'; base-uri 'none'">
<title>GoRss</title>
<style>
:root{color-scheme:light dark;--paper:#fff;--side:#eef2f6;--soft:#f5f7fa;--ink:#243343;--muted:#68788b;--line:#dce3eb;--blue:#245fc2;--selected:#e2ecfc;--danger:#ae333b;--shadow:0 18px 65px #14263c26;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;font-size:14px}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);overflow:hidden}button,input{font:inherit}button{color:inherit;cursor:pointer;border:0;background:transparent;border-radius:7px}button:hover{background:var(--selected)}button:disabled{opacity:.45;cursor:wait}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:3px}button svg{width:18px;height:18px;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.icon{width:32px;height:32px;flex-shrink:0}.titlebar{height:48px;--app-region:drag;display:flex;align-items:center;padding-left:max(24px,var(--mygo-titlebar-inset-left,0px));padding-right:max(16px,var(--mygo-titlebar-inset-right,0px));border-bottom:1px solid var(--line);gap:12px;background:var(--soft)}.brand{font-size:15px;font-weight:700;letter-spacing:-.4px}.brand-mark{background:var(--blue);color:#fff;width:23px;height:23px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:17px}.titlebar .hint{margin-left:auto;color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:218px 335px minmax(0,1fr);height:calc(100dvh - 48px)}.sidebar{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 12px 12px;min-height:0}.nav{display:flex;align-items:center;width:100%;text-align:left;gap:10px;padding:10px 12px;margin:2px 0;color:var(--muted)}.nav.active{background:var(--selected);color:var(--blue);font-weight:600}.count{margin-left:auto;font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}.section-label{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;margin:23px 10px 6px}.feed-list{overflow:auto;flex:1}.feed{display:flex;align-items:center;gap:8px}.feed .nav{min-width:0}.feed-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.feed-symbol{width:22px;height:22px;border-radius:5px;background:var(--paper);color:var(--blue);display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0}.feed .remove{opacity:0;font-size:18px;width:25px;height:25px;margin-left:-7px}.feed:hover .remove,.feed:focus-within .remove{opacity:1}.sidebar-footer{border-top:1px solid var(--line);padding-top:12px;display:flex;gap:3px;align-items:center}.sidebar-footer span{font-size:11px;color:var(--muted);margin-left:auto}.list-pane{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0;min-width:0}.list-head{padding:23px 20px 13px}.head-row{display:flex;align-items:center;gap:8px}.head-row h1{font-size:22px;letter-spacing:-.6px;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.subtext{font-size:12px;color:var(--muted);margin:8px 0 15px}.search{width:100%;border:1px solid var(--line);background:var(--soft);padding:9px 12px;border-radius:8px;color:var(--ink)}.article-list{overflow:auto;flex:1;padding:0 8px 10px}.article-row{width:100%;text-align:left;padding:15px 12px;border-radius:8px;display:block;margin:2px 0;border-bottom:1px solid var(--line)}.article-row.active{background:var(--selected);border-color:transparent}.article-meta{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}.article-meta .source{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.unread-dot{width:6px;height:6px;border-radius:50%;background:var(--blue);flex-shrink:0}.article-title{font-size:14px;line-height:1.6;font-weight:600;margin:7px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.article-row.read .article-title{font-weight:400;color:var(--muted)}.article-summary{font-size:12px;line-height:1.6;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.reader-pane{min-width:0;min-height:0;display:flex;flex-direction:column}.reader-toolbar{height:64px;display:flex;align-items:center;gap:5px;padding:0 24px;border-bottom:1px solid var(--line)}.reader-toolbar .source-label{font-size:12px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.reader-toolbar .starred{color:#aa7300;background:#f9ecc7}.text-button{padding:7px 10px;font-size:12px}.article-header{padding:34px 42px 22px;max-width:900px;width:100%;margin:0 auto}.article-header h2{font-size:28px;line-height:1.5;letter-spacing:-.65px;margin:0 0 15px;font-weight:650;overflow-wrap:anywhere}.byline{font-size:12px;line-height:1.8;color:var(--muted)}iframe{border:0;width:100%;flex:1;min-height:0;background:var(--paper)}.empty{display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:30px;color:var(--muted);height:100%;line-height:1.8}.empty .empty-icon{font-size:40px;color:var(--blue);font-weight:300;margin-bottom:8px}.empty h2{font-size:20px;color:var(--ink);font-weight:600;margin:6px}.empty p{max-width:290px;font-size:13px}.primary{background:var(--blue);color:white;padding:10px 17px;border-radius:8px;font-weight:500}.primary:hover{background:#184b9e}.status{padding:9px 18px;background:var(--soft);border-top:1px solid var(--line);font-size:11px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-height:33px}.error-banner{margin:0 20px 12px;padding:10px;background:#fcebee;color:var(--danger);border-radius:7px;font-size:12px;overflow-wrap:anywhere}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;max-width:min(650px,90vw);border-radius:10px;box-shadow:var(--shadow);z-index:5;font-size:13px}.toast:empty{display:none}dialog{border:1px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);padding:28px;box-shadow:var(--shadow);width:min(470px,90vw)}dialog::backdrop{background:#172a454d}dialog h2{font-size:21px;margin:0 0 12px}dialog p{color:var(--muted);font-size:13px;line-height:1.7}dialog label{display:block;font-size:12px;margin:20px 0 8px}dialog input{width:100%;padding:11px;border:1px solid var(--line);border-radius:7px;background:var(--soft);color:var(--ink)}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:25px}.inline-error{color:var(--danger);font-size:12px;line-height:1.6;margin-top:12px}.preview-note{background:#dceafd;color:#245fc2;padding:8px 16px;font-size:12px}.hidden{display:none!important}[hidden]{display:none!important}.back{display:none}::-webkit-scrollbar{width:7px}::-webkit-scrollbar-thumb{background:#8b98a44d;border-radius:8px}
@media(prefers-color-scheme:dark){:root{--paper:#20252b;--side:#252d37;--soft:#272f39;--ink:#e3eaf3;--muted:#a0aec0;--line:#37424f;--blue:#83b1ff;--selected:#304563;--danger:#ffacb5;--shadow:0 18px 65px #0005}.primary{background:#356fcd;color:#fff}.reader-toolbar .starred{color:#f1cb6c;background:#4b422c}.error-banner{background:#4b2b34}.preview-note{background:#304563;color:#c3dbff}}
@media(max-width:1000px){.layout{grid-template-columns:180px 290px minmax(0,1fr)}.article-header{padding:25px}.article-header h2{font-size:23px}.reader-toolbar{padding:0 15px}}
@media(max-width:760px){.layout{grid-template-columns:160px minmax(0,1fr)}.reader-pane{display:none}.layout.reading .list-pane{display:none}.layout.reading .reader-pane{display:flex}.back{display:block}.titlebar .hint{display:none}.article-header{padding:24px}.article-header h2{font-size:22px}}
@media(max-width:480px){.layout{grid-template-columns:115px minmax(0,1fr)}.sidebar{padding:14px 4px}.nav{padding:10px 7px;gap:5px;font-size:12px}.feed-symbol{display:none}.sidebar-footer span{display:none}.list-head{padding:18px 13px}.titlebar{padding-left:16px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="titlebar"><span class="brand-mark" aria-hidden="true">≋</span><span class="brand">GoRss</span><span class="hint">为每一次安静的阅读</span><button class="icon" id="help" title="快捷键" aria-label="快捷键">?</button></header>
<div class="preview-note" id="previewNote" hidden>界面预览：请在桌面应用中添加和阅读真实订阅。</div>
<main class="layout" id="layout">
<aside class="sidebar" aria-label="订阅导航">
<button class="nav active" data-view="all"><span aria-hidden="true">▤</span>全部文章<span class="count" id="allCount">0</span></button>
<button class="nav" data-view="unread"><span aria-hidden="true">○</span>未读<span class="count" id="unreadCount">0</span></button>
<button class="nav" data-view="starred"><span aria-hidden="true">☆</span>收藏<span class="count" id="starCount">0</span></button>
<div class="section-label">我的订阅<button class="icon" id="add" aria-label="添加订阅" title="添加订阅 ⌘N">+</button></div>
<div class="feed-list" id="feedList"></div>
<div class="sidebar-footer"><button class="icon" id="import" title="导入 OPML" aria-label="导入 OPML">⇥</button><button class="icon" id="export" title="导出 OPML" aria-label="导出 OPML">⇤</button><span>本地保存</span></div>
<input type="file" id="opmlFile" accept=".opml,.xml,text/xml,application/xml" hidden>
</aside>
<section class="list-pane" aria-label="文章列表">
<div class="list-head"><div class="head-row"><h1 id="listTitle">全部文章</h1><button class="icon" id="refresh" title="刷新订阅 ⌘R" aria-label="刷新订阅">↻</button><button class="icon" id="markAll" title="全部标为已读" aria-label="全部标为已读">✓</button></div><p class="subtext" id="listInfo">添加订阅，开启阅读</p><input class="search" id="search" type="search" placeholder="搜索文章…" aria-label="搜索文章"></div>
<div class="error-banner" id="feedError" hidden></div>
<div class="article-list" id="articleList"></div><div class="status" id="status" role="status">准备就绪</div>
</section>
<section class="reader-pane" id="readerPane" aria-label="文章正文"></section>
</main>
<dialog id="addDialog" aria-labelledby="addTitle"><form id="addForm"><h2 id="addTitle">添加 RSS 订阅</h2><p>粘贴 RSS 或 Atom 地址。订阅会保存在这台 Mac 上，添加后会立即获取文章。</p><label for="feedURL">订阅地址</label><input id="feedURL" type="url" placeholder="https://example.com/feed.xml" required autocomplete="off"><div class="inline-error" id="addError" role="alert"></div><div class="dialog-actions"><button type="button" id="cancelAdd" class="text-button">取消</button><button class="primary" id="submitAdd" type="submit">添加订阅</button></div></form></dialog>
<dialog id="confirmDialog" aria-labelledby="confirmTitle"><h2 id="confirmTitle">删除订阅？</h2><p id="confirmText"></p><div class="dialog-actions"><button class="text-button" id="cancelRemove">取消</button><button class="primary" id="confirmRemove">删除订阅</button></div></dialog>
<dialog id="helpDialog"><h2>阅读快捷键</h2><p>⌘N 添加订阅<br>⌘R 刷新当前订阅<br>⌘F 搜索文章<br>J / K 下一篇 / 上一篇<br>S 收藏或取消收藏<br>M 切换已读状态<br>Esc 返回文章列表</p><div class="dialog-actions"><button class="primary" id="closeHelp">知道了</button></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
let state={feeds:[],articles:[]},view='all',selected=null,busy=false,pendingRemove=null,toastTimer;
const native=!!window.mygo?.call;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons={star:'<svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z"/></svg>',read:'<svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>',open:'<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4 10 14M10 4H4v16h16v-6"/></svg>'};
function textOnly(html){const doc=new DOMParser().parseFromString(String(html||''),'text/html');doc.querySelectorAll('script,style,iframe,object').forEach(n=>n.remove());return (doc.body.textContent||'').replace(/\s+/g,' ').trim()}
function dateLabel(raw,full=false){const d=new Date(raw);return isNaN(d)?'日期未知':new Intl.DateTimeFormat('zh-CN',full?{year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'}:{month:'numeric',day:'numeric'}).format(d)}
function notify(message){$('toast').textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').textContent='',6500)}
async function call(method,...args){if(!native)throw new Error('请在 GoRss 桌面应用中使用此功能');return window.mygo.call('Reader.'+method,...args)}
function apply(next){state={feeds:next.feeds||[],articles:next.articles||[]};render()}
async function mutate(method,...args){try{apply(await call(method,...args));return true}catch(e){notify(e.message||String(e));try{apply(await call('Snapshot'))}catch{}return false}}
function currentFeed(){return state.feeds.find(f=>f.id===view)}
function articles(){const query=$('search').value.trim().toLocaleLowerCase();return state.articles.filter(a=>(view==='all'||view==='unread'&&(!a.read||a.id===selected)||view==='starred'&&a.starred||a.feedId===view)&&(!query||(a.title+' '+textOnly(a.summary)+' '+a.author).toLocaleLowerCase().includes(query))).sort((a,b)=>String(b.published).localeCompare(String(a.published))||a.id.localeCompare(b.id))}
function setBusy(value,label='正在刷新…'){busy=value;['refresh','add','import','export','markAll'].forEach(id=>$(id).disabled=value);$('status').textContent=value?label:'所有更改已保存在本地'}
function setView(next){view=next;selected=null;$('layout').classList.remove('reading');render()}
function render(){
 $('allCount').textContent=state.articles.length;$('unreadCount').textContent=state.articles.filter(a=>!a.read).length;$('starCount').textContent=state.articles.filter(a=>a.starred).length;
 document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
 $('feedList').replaceChildren();
 for(const f of state.feeds){const row=document.createElement('div');row.className='feed';const b=document.createElement('button');b.className='nav'+(f.id===view?' active':'');b.title=f.url+(f.error?'\n'+f.error:'');b.innerHTML='<span class="feed-symbol">'+esc(f.title.slice(0,1))+'</span><span class="feed-name">'+esc(f.title)+'</span><span class="count">'+(f.error?'!':state.articles.filter(a=>a.feedId===f.id&&!a.read).length||'')+'</span>';b.onclick=()=>setView(f.id);const remove=document.createElement('button');remove.className='remove';remove.textContent='×';remove.setAttribute('aria-label','删除订阅 '+f.title);remove.onclick=()=>{pendingRemove=f;$('confirmText').textContent='“'+f.title+'”的文章、已读记录和收藏也会删除。';$('confirmDialog').showModal()};row.append(b,remove);$('feedList').append(row)}
 if(!state.feeds.length){const p=document.createElement('p');p.style.cssText='padding:0 12px;color:var(--muted);font-size:12px;line-height:1.8';p.textContent='点击 + 添加你的第一个订阅。';$('feedList').append(p)}
 const f=currentFeed(),list=articles();$('listTitle').textContent=f?.title||({all:'全部文章',unread:'未读',starred:'收藏'}[view]||'全部文章');$('listInfo').textContent=list.length+' 篇文章'+(f?.lastFetched?'，更新于 '+dateLabel(f.lastFetched,true):'');$('feedError').hidden=!f?.error;$('feedError').textContent=f?.error?'获取失败：'+f.error+'。请检查地址或稍后刷新。':'';
 $('articleList').replaceChildren();
 for(const a of list){const b=document.createElement('button');b.className='article-row'+(a.read?' read':'')+(a.id===selected?' active':'');const feed=state.feeds.find(f=>f.id===a.feedId);b.innerHTML='<div class="article-meta">'+(!a.read?'<span class="unread-dot"></span>':'')+'<span class="source">'+esc(feed?.title||'订阅')+'</span><span>'+esc(dateLabel(a.published))+'</span>'+(a.starred?'<span aria-label="已收藏">★</span>':'')+'</div><div class="article-title">'+esc(a.title||'无标题')+'</div><div class="article-summary">'+esc(textOnly(a.summary||a.content).slice(0,180))+'</div>';b.onclick=()=>selectArticle(a.id);$('articleList').append(b)}
 if(!list.length){const empty=document.createElement('div');empty.className='empty';empty.innerHTML='<p>'+(!state.feeds.length?'添加订阅后，文章会显示在这里。':$('search').value?'没有匹配的文章。试试其他关键词。':view==='unread'?'所有文章都读完了。':view==='starred'?'阅读时点击星标，留住喜欢的文章。':'还没有文章。点击刷新获取最新内容。')+'</p>';$('articleList').append(empty)}
 renderReader();
}
let renderedArticle='';
function renderReader(){const a=state.articles.find(a=>a.id===selected);const pane=$('readerPane');if(!a){renderedArticle='';pane.innerHTML='<div class="empty"><div class="empty-icon" aria-hidden="true">≋</div><h2>'+(state.feeds.length?'选一篇，慢慢读':'你的阅读，从这里开始')+'</h2><p>'+(state.feeds.length?'文章会在这里展开。已获取的内容可以离线阅读。':'添加喜欢的网站、博客或新闻订阅，将新的文章收进一个安静的地方。')+'</p>'+(!state.feeds.length?'<button class="primary" id="emptyAdd">添加第一个订阅</button>':'')+'</div>';if($('emptyAdd'))$('emptyAdd').onclick=openAdd;return}
 const key=JSON.stringify([a.id,a.content,a.summary,a.title,a.author,a.published,a.url,state.feeds.find(f=>f.id===a.feedId)?.title]);
 if(renderedArticle!==key){renderedArticle=key;const f=state.feeds.find(f=>f.id===a.feedId);pane.innerHTML='<div class="reader-toolbar"><button class="icon back" id="back" aria-label="返回文章列表">‹</button><span class="source-label">'+esc(f?.title||'订阅')+'</span><button class="icon" id="readToggle" title="切换已读状态 M" aria-label="切换已读状态">'+icons.read+'</button><button class="icon" id="starToggle" title="收藏 S" aria-label="收藏">'+icons.star+'</button><button class="text-button" id="openOriginal">在浏览器打开 '+icons.open+'</button></div><div class="article-header"><h2>'+esc(a.title||'无标题')+'</h2><div class="byline">'+esc((a.author?a.author+'　':'')+dateLabel(a.published,true))+'</div></div><iframe id="contentFrame" title="文章内容" sandbox="" referrerpolicy="no-referrer"></iframe>';$('contentFrame').srcdoc=articleDocument(a);$('back').onclick=()=>$('layout').classList.remove('reading');$('readToggle').onclick=toggleRead;$('starToggle').onclick=toggleStar;$('openOriginal').onclick=()=>call('OpenArticle',a.id).catch(e=>notify(e.message));$('openOriginal').disabled=!a.url}
 $('readToggle').style.color=a.read?'var(--blue)':'';$('readToggle').setAttribute('aria-label',a.read?'标为未读':'标为已读');$('starToggle').classList.toggle('starred',a.starred);$('starToggle').setAttribute('aria-pressed',String(a.starred));
}
function articleDocument(a){
 const doc=new DOMParser().parseFromString(a.content||a.summary||'<p>此订阅未提供正文，请在浏览器打开原文。</p>','text/html');
 const allowed=new Set('P BR DIV SPAN H1 H2 H3 H4 H5 H6 UL OL LI BLOCKQUOTE PRE CODE STRONG B EM I U S DEL HR TABLE THEAD TBODY TR TH TD FIGURE FIGCAPTION IMG A SUP SUB DL DT DD'.split(' '));
 const dangerous=new Set('SCRIPT STYLE IFRAME OBJECT EMBED FORM INPUT BUTTON TEXTAREA SELECT LINK META BASE SVG MATH NOSCRIPT TEMPLATE'.split(' '));
 const safeURL=raw=>{try{const u=new URL(raw,a.url||currentFeed()?.url||'');return /^https?:$/.test(u.protocol)?u.href:''}catch{return ''}};
 for(const el of [...doc.body.querySelectorAll('*')]){if(dangerous.has(el.tagName)){el.remove();continue}if(!allowed.has(el.tagName)){el.replaceWith(...el.childNodes);continue}const src=el.getAttribute('src'),href=el.getAttribute('href'),alt=el.getAttribute('alt');for(const attr of [...el.attributes])el.removeAttribute(attr.name);if(el.tagName==='IMG'){const url=safeURL(src||'');if(url){el.setAttribute('src',url);el.setAttribute('loading','lazy');el.setAttribute('referrerpolicy','no-referrer');el.setAttribute('alt',alt||'')}else el.remove()}if(el.tagName==='A'){const url=safeURL(href||'');if(url)el.setAttribute('title',url);/* 阅读沙箱中禁止导航，原文通过顶部按钮打开。 */}}
 const dark=matchMedia('(prefers-color-scheme:dark)').matches;
 return '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src \'none\'; img-src https: http:; style-src \'unsafe-inline\'; base-uri \'none\'; form-action \'none\'"><meta name="referrer" content="no-referrer"><style>:root{color-scheme:'+(dark?'dark':'light')+'}body{margin:0 auto;padding:0 42px 60px;max-width:900px;font:17px/1.95 -apple-system,\"PingFang SC\",sans-serif;color:'+(dark?'#dbe3ee':'#344255')+';overflow-wrap:anywhere}p{margin:0 0 1.25em}h1,h2,h3{line-height:1.5;margin:1.3em 0 .6em}img{max-width:100%;height:auto;border-radius:5px}a{color:'+(dark?'#83b1ff':'#245fc2')+'}blockquote{border-left:3px solid #839ec2;margin:20px 0;padding:0 20px;color:'+(dark?'#a0aec0':'#68788b')+'}pre{white-space:pre-wrap;background:'+(dark?'#272f39':'#f5f7fa')+';padding:16px;border-radius:7px;font-size:13px;line-height:1.7}code{font-family:ui-monospace,monospace}table{border-collapse:collapse;max-width:100%;font-size:14px;display:block;overflow:auto}td,th{border:1px solid #839ec266;padding:8px}hr{border:0;border-top:1px solid #839ec266;margin:28px 0}@media(max-width:500px){body{padding:0 24px 40px;font-size:16px}}</style></head><body>'+doc.body.innerHTML+'</body></html>';
}
async function selectArticle(id){selected=id;$('layout').classList.add('reading');render();const a=state.articles.find(a=>a.id===id);if(a&&!a.read)await mutate('SetRead',id,true)}
async function toggleStar(){const a=state.articles.find(a=>a.id===selected);if(a)await mutate('SetStarred',a.id,!a.starred)}
async function toggleRead(){const a=state.articles.find(a=>a.id===selected);if(a)await mutate('SetRead',a.id,!a.read)}
function openAdd(){if(busy)return;$('addError').textContent='';$('addDialog').showModal();$('feedURL').focus()}
async function refresh(){if(busy)return;setBusy(true);try{apply(await call('Refresh',currentFeed()?.id||''));notify('订阅已更新')}catch(e){notify('部分订阅刷新失败：'+e.message);try{apply(await call('Snapshot'))}catch{}}finally{setBusy(false)}}
$('add').onclick=openAdd;$('cancelAdd').onclick=()=>$('addDialog').close();$('refresh').onclick=refresh;$('help').onclick=()=>$('helpDialog').showModal();$('closeHelp').onclick=()=>$('helpDialog').close();$('search').oninput=render;
$('addForm').onsubmit=async e=>{e.preventDefault();if(busy)return;const url=$('feedURL').value.trim();if(!/^https?:\/\//i.test(url)){$('addError').textContent='请输入以 https:// 或 http:// 开头的 RSS 地址。';return}setBusy(true,'正在添加订阅…');$('submitAdd').disabled=true;try{apply(await call('Add',url));$('addDialog').close();$('feedURL').value='';notify('订阅已添加')}catch(e){$('addError').textContent='添加或获取失败：'+e.message+'。地址已保存时，可关闭此窗口后重试刷新。';try{apply(await call('Snapshot'))}catch{}}finally{setBusy(false);$('submitAdd').disabled=false}};
$('cancelRemove').onclick=()=>{pendingRemove=null;$('confirmDialog').close()};$('confirmRemove').onclick=async()=>{if(!pendingRemove)return;const id=pendingRemove.id;$('confirmRemove').disabled=true;try{if(await mutate('Remove',id)){if(view===id)setView('all');pendingRemove=null;$('confirmDialog').close();notify('订阅已删除')}}finally{$('confirmRemove').disabled=false}};
$('markAll').onclick=()=>mutate('MarkAllRead',currentFeed()?.id||'');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
$('import').onclick=()=>$('opmlFile').click();$('opmlFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(file.size>2*1024*1024){notify('OPML 文件不能超过 2 MB');return}setBusy(true,'正在导入订阅…');try{apply(await call('ImportOPML',await file.text()));notify('订阅已导入，点击刷新获取文章')}catch(e){notify('导入失败：'+e.message)}finally{setBusy(false);$('opmlFile').value=''}};
$('export').onclick=async()=>{if(!native){notify('请在 GoRss 桌面应用中导出订阅');return}try{const path=await window.mygo.call('Desktop.ExportSubscriptions');if(path)notify('订阅备份已保存')}catch(e){notify('导出失败：'+e.message)}};
window.addEventListener('keydown',e=>{const input=/INPUT|TEXTAREA/.test(e.target.tagName);if(e.key==='Escape'){$('layout').classList.remove('reading');return}if(e.metaKey||e.ctrlKey){if(e.key.toLowerCase()==='n'){e.preventDefault();openAdd()}if(e.key.toLowerCase()==='r'){e.preventDefault();refresh()}if(e.key.toLowerCase()==='f'){e.preventDefault();$('search').focus()}return}if(input||document.querySelector('dialog[open]'))return;if(e.key==='s')toggleStar();if(e.key==='m')toggleRead();if(e.key==='j'||e.key==='k'){const list=articles();const i=list.findIndex(a=>a.id===selected);const target=list[Math.max(0,Math.min(list.length-1,i+(e.key==='j'?1:-1)))];if(target)selectArticle(target.id)}});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{renderedArticle='';renderReader()});
(async()=>{render();if(!native){$('previewNote').hidden=false;$('layout').style.height='calc(100dvh - 82px)';$('status').textContent='浏览器仅用于界面预览';return}try{apply(await call('Snapshot'));$('status').textContent='订阅和文章保存在这台 Mac 上'}catch(e){notify('读取失败：'+e.message)}setInterval(()=>{if(!busy&&state.feeds.length&&!document.querySelector('dialog[open]'))refresh()},15*60*1000)})();
